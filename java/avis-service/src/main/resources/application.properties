# Le service Java écoute sur 8081 ; l'API Python reste sur 8000.
server.port=${PORT:8081}
spring.application.name=avis-service
# Adresse et clé de l'API Python : jamais écrites ici, lues dans l'environnement.
sentiment.api.url=${SENTIMENT_API_URL:http://127.0.0.1:8000}
sentiment.api.key=${SENTIMENT_API_KEY:}
# Délais du client HTTP (secondes) : un modèle bloqué ne doit pas bloquer le service Java
sentiment.api.connect-timeout=3
sentiment.api.read-timeout=10
# Transport HTTP : jdk-http11 (défaut). Les deux autres valeurs ne servent qu'à reproduire les pièges du TP.
sentiment.api.transport=jdk-http11
